[package]
name = "forge-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "DeepSeek Forge core: unified package model, manifest, registry, errors, and events"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
semver = "1"

[dev-dependencies]
tempfile = "3"
