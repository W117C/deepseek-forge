[package]
name = "forge-core"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "DeepSeek Forge core: unified package model, manifest, registry, errors, and events"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
semver = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
