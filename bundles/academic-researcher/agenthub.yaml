schema: agenthub.dev/agent/v1
id: academic-researcher
name: Academic Researcher
category: 学术 Academic
version: 0.1.0
description: 把 DeepSeek Harness 变成学术研究 Agent：文献检索与综述、论文分析、引文核验。
publisher:
  id: agenthub
  name: AgentHub
runtime: deepseek-harness
compatibility:
  dsh:
    min: "0.1.0-rc.6"
    tested: ["0.1.0-rc.6"]
  node: ">=22"
platform: [darwin, linux]
components:
  bundles:
    - package: "@agenthub/research-core"
      version: "0.1.0"
    - package: "@agenthub/dsh-client-ui-research"
      version: "0.1.0"
  presets:
    - id: academic-researcher
      base: standard
  skills:
    - literature-review
    - paper-analysis
profile:
  name: research
  bundles: ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "@agenthub/research-core", "@agenthub/dsh-client-ui-research"]
  patch: ./profile.patch.yml
permissions:
  network: ["localhost:3112"]
  env: []
secrets: []
# P0-B：数据源 provider 声明。安装时选择（--data-source <id> 或交互），
# 选中的 provider 以 disabled: false 写入 profile patch，装完即启用。
dataSources:
  - id: local-mcp
    label: 本地自建 MCP（默认，无需凭据）
    default: true
    config:
      serverName: papers
      transport: streamable-http
      url: 'http://localhost:3112/mcp'
      failOnStartupError: false
  - id: arxiv
    label: arXiv / Semantic Scholar（免费公共 API）
    config:
      serverName: papers
      transport: streamable-http
      url: 'http://localhost:3112/mcp'
      failOnStartupError: false
health:
  - kind: dump-config
    expect-rows: [mcp-papers, schedule]
updatePolicy: notify
trust: official
