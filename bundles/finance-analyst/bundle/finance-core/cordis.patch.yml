# @agenthub/finance-core —— finance profile 的宿主平面 bundle 层。
# 应用在 dsh-base / dsh-web-app 之后：按 row id 覆盖（整 config 替换，后写赢），
# 上层（profile cordis.patch.yml / home patch / --patch）可继续覆盖本层。

# 研究需要全文抓取：把默认的 web_search-only 覆盖为 search + fetch。
- id: tool-web
  config:
    search: true
    fetch: true
    searchTimeoutMs: 60000
    fetchTimeoutMs: 45000

- insert:
    # 市场数据 seam：默认禁用。安装后在 profile patch 中启用并配置 provider
    # （Tushare/AkShare/自建 MCP server 均可，换 provider 只改这一行）。
    - id: mcp-market-data
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: marketdata
        transport: streamable-http
        url: 'http://localhost:3111/mcp'
        failOnStartupError: false

    # 会话级定时任务（盯盘 / 定期简报），状态持久化在 Session 日志里。
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # 金融数据看板面板：DSH Web 浏览器面板（dsh.client roster 扫描挂载）。
    - id: ui-market-data
      name: '@agenthub/dsh-client-ui-market-data'
