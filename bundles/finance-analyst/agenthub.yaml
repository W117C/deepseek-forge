schema: agenthub.dev/agent/v1
id: finance-analyst
name: Finance Analyst
category: 金融 Finance
version: 0.1.0
description: 把 DeepSeek Harness 变成金融研究与决策支持 Agent。
publisher:
  id: agenthub
  name: AgentHub
runtime: deepseek-harness
compatibility:
  dsh:
    min: "0.1.0-rc.6"
    tested: ["0.1.0-rc.6"]
  node: ">=22"
platform: [darwin, linux]
components:
  bundles:
    - package: "@agenthub/finance-core"
      version: "0.1.0"
    - package: "@agenthub/dsh-client-ui-market-data"
      version: "0.1.0"
  presets:
    - id: finance-analyst
      base: standard
  skills:
    - financial-analysis
    - company-research
profile:
  name: finance
  bundles: ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "@agenthub/finance-core", "@agenthub/dsh-client-ui-market-data"]
  patch: ./profile.patch.yml
permissions:
  network: ["localhost:3111"]
  env: []
secrets: []
# P0-B：数据源 provider 声明。安装时选择（--data-source <id> 或交互），
# 选中的 provider 以 disabled: false 写入 profile patch，装完即启用。
dataSources:
  - id: local-mcp
    label: 本地自建 MCP（默认，无需凭据）
    default: true
    config:
      serverName: marketdata
      transport: streamable-http
      url: 'http://localhost:3111/mcp'
      failOnStartupError: false
  - id: tushare
    label: Tushare（需 TUSHARE_TOKEN，安装后编辑 profile patch 添加鉴权头）
    config:
      serverName: marketdata
      transport: streamable-http
      url: 'http://localhost:3111/mcp'
      failOnStartupError: false
      # 注意：安全扫描会阻断动态求值表达式，鉴权头请在安装后手动添加：
      # headers: { Authorization: 'Bearer <你的 token>' }
health:
  - kind: dump-config
    expect-rows: [mcp-market-data, schedule]
updatePolicy: notify
trust: official
