schema: agenthub.dev/agent/v1
id: deep-research-combo
name: 深度研究 Agent
category: 研究 Research
version: 0.1.0
description: 深度研究 Agent：按 stars 精选社区高星组件组合而成（archify, brooks-lint）。
publisher:
  id: agenthub
  name: AgentHub
runtime: deepseek-harness
compatibility:
  dsh:
    min: "0.1.0-rc.6"
    tested: ["0.1.0-rc.6"]
  node: ">=22"
