components:
  bundles: []
  presets:
    - id: deep-research-combo
      base: standard
  skills:
    - archify
    - brooks-lint
    - pdf
profile:
  name: deep-research-combo
  bundles: ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app"]
  patch: ./profile.patch.yml
permissions:
  network: []
  env: []
secrets: []
health:
  - kind: dump-config
    expect-rows: []
updatePolicy: notify
trust: community
