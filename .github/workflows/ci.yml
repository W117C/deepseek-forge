name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: 全量 e2e（18+parity 套，含 Rust 引擎委托桥）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # DSH CLI：e2e 通过 locateDsh() 在 PATH 上找到它
      # （@latest = 0.1.0-rc.6，与 docs/dsh-integration.md 源码级核实基线一致）
      - name: 安装 DeepSeek Harness CLI
        run: npm install -g @deepseek-ai/dsh

      - name: 安装 pnpm
        run: npm install -g pnpm

      - name: 构建 forge-core（Node 委托桥的 Rust 引擎）
        run: cargo build --release --manifest-path crates/forge-core/Cargo.toml

      - name: 版本自检
        run: |
          node -v
          dsh --version || true
          pnpm -v

      - name: 运行全部 e2e 套件
        run: |
          FAIL=0
          for t in test/e2e*.mjs; do
            echo "=================================================="
            echo "== RUN $t"
            echo "=================================================="
            if ! node "$t"; then
              echo "::error::$t 失败"
              FAIL=1
            fi
          done
          if [ "$FAIL" != 0 ]; then
            echo "::error::存在失败的 e2e 套件"
            exit 1
          fi
          echo "全部 e2e 套件通过 ✓"

  web:
    name: 前端构建（landing + forge）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [landing, forge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: npm ci（${{ matrix.app }}）
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: 类型检查 + 生产构建（${{ matrix.app }}）
        run: npm run build
        working-directory: ${{ matrix.app }}

  core:
    name: Rust 核心（forge-core）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable
        run: rustup update stable && rustup default stable

      - name: fmt 检查
        run: cargo fmt --all -- --check
        working-directory: crates/forge-core

      - name: 单元测试
        run: cargo test
        working-directory: crates/forge-core

      - name: release 构建
        run: cargo build --release
        working-directory: crates/forge-core

  binaries:
    name: forge-core 预构建二进制（D1，三平台）
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        run: rustup update stable && rustup default stable
      - name: 构建 release 二进制
        run: cargo build --release --manifest-path crates/forge-core/Cargo.toml --target ${{ matrix.target }}
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: forge-core-${{ matrix.platform }}
          path: crates/forge-core/target/${{ matrix.target }}/release/forge-core*
